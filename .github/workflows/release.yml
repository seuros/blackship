name: release-please

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and upload artifacts'
        type: boolean
        default: false
      tag:
        description: 'Tag to release (e.g. blackship-v0.3.1)'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Job outputs are strings: compare against 'true', since "false" is truthy.
      release_created: ${{ steps.release.outputs.release_created == 'true' || inputs.force_build == true }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.tag }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ !inputs.force_build }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-freebsd:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: cross-platform-actions/action@v1
        with:
          operating_system: freebsd
          version: '15.1'
          run: |
            sudo pkg install -y curl protobuf llvm
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . $HOME/.cargo/env
            cargo build --release
            strip target/release/blackship
            mkdir -p dist
            cd target/release
            tar czf blackship-freebsd-amd64.tar.gz blackship
            mv blackship-freebsd-amd64.tar.gz ../../dist/

      - uses: actions/upload-artifact@v7
        with:
          name: blackship-freebsd-amd64
          path: dist/blackship-freebsd-amd64.tar.gz
          retention-days: 1

  build-manual:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures

      - name: Build manual
        run: make -C docs/manual

      - uses: actions/upload-artifact@v7
        with:
          name: blackship-manual
          path: docs/manual/blackship-manual.pdf
          retention-days: 1

  upload-assets:
    needs: [release-please, build-freebsd, build-manual]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && needs.build-freebsd.result == 'success' && needs.build-manual.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: blackship-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.pdf > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: artifacts/*
