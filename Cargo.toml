[package]
name = "blackship"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "BSD-3-Clause"
description = "A FreeBSD jail manager with state machine control"
repository = "https://github.com/seuros/blackship"
readme = "README.md"
keywords = ["freebsd", "jail", "manager", "state-machine"]
categories = ["command-line-utilities", "os::freebsd-apis"]
include = [
    "/src/**",
    "!**/tests.rs",
    "/build.rs",
    "/build/**",
    "/README.md",
    "/LICENSE",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "blackship"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "mcp"]
# The `blackship` binary and its argument parser. Library consumers can
# drop it with `default-features = false`.
cli = ["dep:usage-rs", "telemetry"]
# OTLP export of lifecycle events and racct gauges (`[telemetry]`).
telemetry = ["dep:rama"]
# Placeholder `blackship ui`: a loopback page with Datastar patches, served by rama.
ui = ["cli", "dep:rama"]
mcp = ["cli", "dep:mcp-host", "dep:schemars", "dep:tracing", "dep:tracing-subscriber"]
# state_machine! expands cfg(feature = "inspect") into the calling crate.
inspect = ["state-machines/inspect"]

[dependencies]
# CLI
usage-rs = { version = "7", features = ["completions"], optional = true }

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tempfile = "3.27.0"

# Dependency graph
petgraph = "0.8"

# Error handling
thiserror = "2.0"

# FFI
libc = "0.2"
nix = { version = "0.31", features = ["user", "mount", "process", "signal", "fs", "hostname"] }
bitflags = "2.11"
byteorder = "1.5"

# HTTP/Bootstrap
ureq = "3.4"
sha2 = "0.11"
hex = "0.4"
tar = "0.4"
xz2 = "0.1"
zstd = "0.14"

# Networking
ipnet = "2.12"

# Template parsing
nom = "8.0"

# State machine and resilience (seuros crates)
state-machines = { version = "0.34.1", features = ["dynamic", "runtime-send", "serde"] }
breaker-machines = "0.24.0"
chrono-machines = "0.11.1"
throttle-machines = "0.5.0"
supervisor-machines = "0.4.0"
deadline-machines = "0.4.0"
rand = "0.10"

# Async runtime for Warden
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "net"] }
jiff = "0.2"

# Telemetry
rama = { version = "0.4", features = ["opentelemetry", "grpc", "http-full", "rustls"], optional = true }
mcp-host = { version = "0.23.0", features = ["http", "macros"], optional = true }
schemars = { version = "1.2.2", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
harel-machines = { version = "0.2.1", default-features = false }
suspect-machines = "0.2.0"
shed-machines = "0.2.1"

[dev-dependencies]
rogue-machines = "0.2.1"
state-machines = { version = "0.34.1", features = ["dynamic", "runtime-send", "serde", "inspect"] }

[lints.rust]
# FFI lives in the modules that opt in with #![allow(unsafe_code)]; anything
# else reaching for unsafe fails the build.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Rewrites plain `if let .. else` into nested map_or_else closures; in
# error-heavy code that reads worse, not better.
option_if_let_else = "allow"
