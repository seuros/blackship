[package]
name = "blackship"
version = "0.1.6"
edition = "2024"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "BSD-3-Clause"
description = "A FreeBSD jail manager with state machine control"
repository = "https://github.com/seuros/blackship"
readme = "README.md"
keywords = ["freebsd", "jail", "manager", "state-machine"]
categories = ["command-line-utilities", "os::freebsd-apis"]

[features]
default = []
# state_machine! expands cfg(feature = "inspect") into the calling crate.
inspect = ["state-machines/inspect"]

[dependencies]
# CLI
usage = { package = "usage-rs", version = "6", features = ["completions"] }

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Dependency graph
petgraph = "0.8"

# Error handling
thiserror = "2.0"

# FFI
libc = "0.2"
nix = { version = "0.31", features = ["user", "mount", "process", "signal"] }
bitflags = "2.11"
byteorder = "1.5"

# HTTP/Bootstrap
ureq = "3.4"
sha2 = "0.11"
hex = "0.4"
tar = "0.4"
xz2 = "0.1"
zstd = "0.13"

# Networking
ipnet = "2.12"

# Template parsing
nom = "8.0"

# State machine and resilience (seuros crates)
state-machines = "0.20"
breaker-machines = "0.16.1"
chrono-machines = "0.6"
throttle-machines = "0.2"
rand = "0.10"

# Async runtime for Warden
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "net"] }
jiff = "0.2.32"
