name: ci
on: [push]

jobs:
  test:
    runs-on: freebsd
    steps:
      - uses: actions/checkout@v7

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      # The jail this runs in was created by the binary it just built.
      - name: blackship tests blackship
        run: |
          ./target/release/blackship --version
          ./target/release/blackship releases
          sysctl -n security.jail.jailed

      - name: package
        run: |
          strip target/release/blackship
          mkdir -p dist
          tar czf dist/blackship-freebsd-amd64.tar.gz -C target/release blackship
          sha256 -r dist/blackship-freebsd-amd64.tar.gz > dist/checksums.txt
          ls -lh dist/

      # Pinned to v3 on purpose: v4+ speaks the @actions/artifact v2 API,
      # which this Forgejo does not serve (it answers GHESNotSupportedError).
      - uses: actions/upload-artifact@v3
        with:
          name: blackship-freebsd-amd64
          path: dist/
          retention-days: 7
